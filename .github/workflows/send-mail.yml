name: Gameinside Mail

# Herbruikbaar voor losse mails aan de redactie via workflow_dispatch. Had
# eerder een eenmalige schedule-trigger voor de to-do-mail van 1 september
# 2026, maar die cron is nooit afgegaan (0 runs) en is met de hand alsnog
# verstuurd. Regel er weer uit, zoals gepland.
on:
  workflow_dispatch:
    inputs:
      subject:
        description: 'Onderwerp'
        type: string
        default: '[Gameinside] Bericht'
      heading:
        description: 'Kop boven in de mail'
        type: string
        default: ''
      lines:
        description: 'Regels, gescheiden door |'
        type: string
        default: ''

jobs:
  mail:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        working-directory: automation
        run: npm ci || npm install

      - name: Verstuur mail
        working-directory: automation
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node send-custom.js "${{ inputs.subject }}" "${{ inputs.heading }}" "${{ inputs.lines }}"
