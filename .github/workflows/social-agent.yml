name: Gameinside Social Agent

on:
  schedule:
    # Elke 2 uur, niet op het hele uur (zelfde val als bij de news agent,
    # zie daily-research.yml). Stond eerst op eens per dag ('s avonds), maar
    # dan postte hij nieuws van artikelen die overdag met de hand live waren
    # gezet pas de volgende run op X: het zag er dan al een dag oud uit.
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Alleen tonen, geen mail en niets onthouden'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        working-directory: automation
        run: npm ci || npm install

      - name: Run social agent
        working-directory: automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node social-agent.js ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Bewaar welke artikelen al verwerkt en gepost zijn
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Gameinside Bot"
          git add automation/social-seen.json automation/x-queue.json
          if git diff --staged --quiet; then
            echo "Geen wijziging in social-seen.json of x-queue.json"
            exit 0
          fi
          git commit -m "chore: social agent seen [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push poging $i mislukt, opnieuw..."
            sleep 5
          done
          exit 1
