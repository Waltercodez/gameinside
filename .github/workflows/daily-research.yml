name: Gameinside News Agent

on:
  schedule:
    # Elke 2 uur, op minuut 17. Niet op het hele uur: dan is de gedeelde
    # runnerpool van GitHub het drukst en worden geplande runs als eerste
    # geschrapt. Op 27 en 28 augustus 2026 draaide er van de zes geplande
    # runs nog maar een per dag. Twaalf slots op een rustig tijdstip vangen
    # het op als GitHub er alsnog een laat vallen.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Alleen selectie tonen, niets schrijven'
        type: boolean
        default: false

# Twee runs tegelijk zouden dezelfde state.json overschrijven.
concurrency:
  group: news-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        working-directory: automation
        run: npm ci || npm install

      - name: Controleer of de feeds nog leven
        working-directory: automation
        continue-on-error: true
        run: npm run check-feeds

      - name: Run news agent
        working-directory: automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node news-fetcher.js ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Meld nieuwe URLs bij Google
        # Na de agent, zodat verse artikelen meteen meegaan. Nooit blokkerend:
        # de sitemap doet het werk ook zonder deze stap, dit versnelt alleen.
        if: ${{ !inputs.dry_run }}
        working-directory: automation
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node index-sweep.js

      - name: Bewaar state
        # always() zodat de dedup-state ook bewaard blijft als de agent faalt.
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Gameinside Bot"
          git add automation/state.json automation/indexed.json
          if git diff --staged --quiet; then
            echo "Geen wijziging in state.json"
            exit 0
          fi
          git commit -m "chore: news agent state [skip ci]"
          # Een andere run kan intussen gepusht hebben, dus rebase en probeer opnieuw.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push poging $i mislukt, opnieuw..."
            sleep 5
          done
          exit 1
