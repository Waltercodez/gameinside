name: Gameinside News Agent

on:
  schedule:
    # Elke 3 uur. Tijden in UTC, dat is 07/10/13/16/19/22 in Amsterdam (zomertijd).
    - cron: '0 5,8,11,14,17,20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Alleen selectie tonen, niets schrijven'
        type: boolean
        default: false

# Twee runs tegelijk zouden dezelfde state.json overschrijven.
concurrency:
  group: news-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: automation/package-lock.json

      - name: Install dependencies
        working-directory: automation
        run: npm ci || npm install

      - name: Controleer of de feeds nog leven
        working-directory: automation
        continue-on-error: true
        run: npm run check-feeds

      - name: Run news agent
        working-directory: automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node news-fetcher.js ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Bewaar state
        if: ${{ !inputs.dry_run }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Gameinside Bot"
          git add automation/state.json
          if git diff --staged --quiet; then
            echo "Geen wijziging in state.json"
            exit 0
          fi
          git commit -m "chore: news agent state [skip ci]"
          # Een andere run kan intussen gepusht hebben, dus rebase en probeer opnieuw.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push poging $i mislukt, opnieuw..."
            sleep 5
          done
          exit 1
